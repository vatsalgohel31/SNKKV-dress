{% extends 'base.html' %}

{% block title %}Sign In - School Dress Management{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card glass-panel">
        <div class="login-header">
            <div class="login-brand-icon">
                <i class="fa-solid fa-shirt"></i>
            </div>
            <h2>Portal Sign In</h2>
            <p>School Dress Management &amp; Order System</p>
        </div>

        <form method="POST" action="{% url 'login' %}" class="login-form" autocomplete="off">
            {% csrf_token %}
            <div class="form-group">
                <label for="username" class="form-label">
                    <i class="fa-solid fa-user"></i> Username
                </label>
                <div class="input-icon-wrapper">
                    <input type="text" name="username" id="username" class="form-control" placeholder="Enter username" required autofocus autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    <i class="fa-solid fa-lock"></i> Password
                </label>
                <div class="input-icon-wrapper">
                    <input type="password" name="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
